<head>

<link rel="stylesheet" href="style.css">
<link rel="shortcut icon" href="video/img/emblema.png" type="image/x-icon">

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC3_6sPq6KJoWTnQB3Ang9RKXI3i5MhgYM",
  authDomain: "centrotreinamentobiblico.firebaseapp.com",
  projectId: "centrotreinamentobiblico",
  storageBucket: "centrotreinamentobiblico.firebasestorage.app",

};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

<style>
/* --- ESTILO DO LINK DE ESQUECI SENHA --- */
.forgot-text {
    text-align: right;
    margin-top: -10px;
    margin-bottom: 10px;
}

.forgot-text a {
    color: #d1f7d6;
    font-size: 14px;
    text-decoration: none;
    transition: 0.2s;
}

.forgot-text a:hover {
    color: white;
    text-decoration: underline;
}
</style>

</head>

<body>
<div class="background-overlay"></div>

<main class="login-card">
    <h1>Login</h1>

    <form id="loginForm">
        <p id="erro"></p>

        <div class="input-box">
            <i class="bx bxs-envelope"></i>
            <input type="email" id="email" placeholder="Email" required>
        </div>

        <div class="input-box">
            <i class="bx bxs-lock-alt"></i>
            <input type="password" id="senha" placeholder="Senha" required>
        </div>

        <!-- ESQUECI SENHA -->
        <p class="forgot-text">
            <a href="#" id="esqueciSenha">Esqueci minha senha</a>
        </p>

        <button class="btn-login" type="submit">Entrar</button>

        <p class="register-text">
            Não tem uma conta?
            <a href="register.html">Cadastre-se</a>
        </p>
    </form>
</main>

<script>
const loginForm = document.getElementById("loginForm");
const erro = document.getElementById("erro");

loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;

    try {
        await auth.signInWithEmailAndPassword(email, senha);
        window.location.href = "home.html";
    } catch (error) {
        erro.textContent = "Email ou senha incorretos.";
    }
});

// 🔧 FUNÇÃO DE RECUPERAÇÃO DE SENHA
document.getElementById("esqueciSenha").addEventListener("click", async (e) => {
    e.preventDefault();

    const email = prompt("Digite seu email para recuperar a senha:");

    if (!email) return;

    try {
        await auth.sendPasswordResetEmail(email);
        alert("Enviamos um link de recuperação para seu email!");
    } catch (error) {
        if (error.code === "auth/user-not-found") {
            alert("Este email não está cadastrado.");
        } else if (error.code === "auth/invalid-email") {
            alert("Digite um email válido.");
        } else {
            alert("Erro ao enviar email de recuperação.");
        }
    }
});
</script>

</body>
</html>
