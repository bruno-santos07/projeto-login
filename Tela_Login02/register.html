<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre-se</title>
    <link rel="shortcut icon" href="img/WhatsApp Image 2025-07-07 at 14.17.34.jpeg" type="image/x-icon">
    <style>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
        }

        body{
         height: 100vh;
         background-image: url("img/WhatsApp Image 2025-07-07 at 14.17.34.jpeg");
         background-size: cover;
         background-position: center;
         background-repeat: no-repeat;

         display: flex;
         justify-content: center;
         align-items: center;
    }       
        form{
            width: 320px;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 40px;
            border-radius: 20px;
            color: white;
            text-align: center;
        }
        h1{
            margin-bottom: 20px;
        }
        
        input{
            width: 100%;
            padding: 12px;
            margin: 10px 0px;
            border-radius: 10px;
            border: none;
        }

        button{
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: white;
        color: black;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
         }

         .entt{
            padding: 7px;
            color: white;
            font-weight: bolder;
         }

         h2{
            padding-bottom: 10px;
         }

         #cadastro:hover{
            background-color: #009acd;
            color: black;
            font-weight: bolder;
         }

         #cadastro{
            font-weight: bold;
         }


    </style>
</head>
<body>
    
    <form onsubmit="return verificarSenha()">
        <h2>Criar conta</h2> 
        <div>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>
        <div>
            <input type="email" id="email" name="nome" placeholder="Email" required>
        </div>
        <div>
            <input type="tel" id="numero" name="numero" placeholder="Contato" required>
        </div>
        <div>
            <input type="text" id="igreja" name="igreja" placeholder="Igreja" required>
        </div>
        <div>
            <input type="date" name="data" id="data" placeholder="dia/mês/ano" required>
        </div>
        <div>
            <input type="password" id="senha" name="senha" placeholder="Senha" required>
            <input type="password" id="isenha" name="isenha" placeholder="Repita sua senha" required>
        </div>

        <button id="cadastro" type="submit" value="Cadastrar">Cadastrar</button>
        <p class="entt">Já tem conta? <a class="entt" href="index.html">Entrar</a></p>

        <input class="botao" type="checkbox" name="naoSouRobo" id="naoSouRobo">
    </form>

    <script>
        function verificarSenha(){
            let senha = document.getElementById("senha").value; // Recebe valor input (senha)
            let confirmarSenha = document.getElementById('isenha').value; // recebe valor input (isenha)
            
            if(senha !== confirmarSenha){ 
                alert("Senha está diferente, tente novamente!")
                return false; 
            }else{
                alert('Cadastro Realizado com sucesso!')  
            }
            return true;
        }
        
        function verificarSenha(){
            let caracterSenha = document.getElementById("senha").value;
            if(caracterSenha.length < 6 || caracterSenha.length > 12){
                alert('A senha deve ter 6 a 12 caracteres!')
                return false;
            }
            return true;

            let robo = document.getElementById("naoSouRob").checked;
            if(!robo){
                alert("Por favor, confirme que não é um robô!");
                return false;
            }
            return true;
        }
     
        </script>
    
</body>
</html>
